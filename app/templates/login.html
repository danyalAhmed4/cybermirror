{% extends "base.html" %}
{% block title %}Sign in — OrbitMart{% endblock %}
{% block content %}
<section class="om-card">
  <h1>Sign in</h1>
  <p class="om-muted">Access your OrbitMart workspace account.</p>
  <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="off">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button class="om-btn om-btn-block" type="submit">Sign in</button>
  </form>
  <p class="form-footer">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
