{% extends "base.html" %}
{% block title %}Create account — OrbitMart{% endblock %}
{% block content %}
<section class="om-card">
  <h1>Create account</h1>
  <p class="om-muted">Register a workspace identity for the OrbitMart twin.</p>
  <form method="POST" action="{{ url_for('auth.register') }}" autocomplete="off">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required>

    <label for="email">Work email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button class="om-btn om-btn-block" type="submit">Create account</button>
  </form>
  <p class="form-footer">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</section>
{% endblock %}
